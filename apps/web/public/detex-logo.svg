<?xml version="1.0" encoding="UTF-8"?>
<!--
  Detex Technologies — DT monogram (approximation of the supplied logo).
  Drawn at 64x64 to render crisply at any size from favicon (16px) to header.
  Color: the same medium-grey from the source PNG (#5a5a5a).

  To replace with the real PNG/SVG from your brand kit, drop the file at
  this same path and BrandMark.tsx will pick it up automatically.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- D — left half: filled semicircle anchored on its right edge -->
  <path
    d="M 32 8 L 18 8 A 24 24 0 0 1 18 56 L 32 56 Z"
    fill="#5a5a5a"
  />
  <!-- T — right half: vertical stem with a top cap -->
  <rect x="34" y="8" width="6"  height="48" fill="#5a5a5a" />
  <rect x="30" y="8" width="20" height="6"  fill="#5a5a5a" />
</svg>
