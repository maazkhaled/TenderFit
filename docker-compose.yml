# TenderFit — Docker Compose stack (production-shaped)
#
# Services:
#   postgres : Postgres 16 with pgvector. Stores tenders, profiles, matches.
#              Not exposed publicly — reachable only from web/worker on the
#              compose network at `postgres:5432`.
#   web      : Next.js 14 production server. Tenant dashboard + /api/v1/*.
#              Not exposed publicly — Caddy reverse-proxies to web:3000.
#   worker   : Long-running cron (ingest every 6h, match hourly, digest 15m).
#              Also exposes an internal HTTP API on :8080 for the dashboard's
#              "Run now" buttons (Fetch tenders / Find matches / Send digest).
#              Auth-gated via WORKER_AUTH_TOKEN. Not exposed publicly.
#   caddy    : Reverse proxy + automatic HTTPS via Let's Encrypt. The only
#              service with public ports (80, 443). Reads DOMAIN + EMAIL from
#              env vars and matches them against the Caddyfile at the repo
#              root.
#
# Local dev (no public domain): comment out the caddy service block and
# uncomment `ports: - "3000:3000"` on web so localhost:3000 works directly.
# For production deployments behind a domain, leave this file as-is.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_beta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_beta"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: web
    container_name: pb_web
    restart: unless-stopped
    working_dir: /app
    command: ["pnpm", "--filter", "web", "start"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Postgres is reached over the compose network — Prisma URL points at
      # the service hostname, NOT localhost.
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/project_beta?schema=public"
      NODE_ENV: production
      # Production URL; used by digest links and login redirects. Override at
      # docker-compose level so it takes effect regardless of what .env says.
      APP_URL: "https://tenderfit.detex.site"
      # Bearer token the web container sends to the worker's internal API.
      # Read from .env so it's not committed to git.
      WORKER_AUTH_TOKEN: ${WORKER_AUTH_TOKEN}
    # No `ports:` — Caddy proxies to web:3000 over the compose network.
    expose:
      - "3000"

  worker:
    build:
      context: .
      target: worker
    container_name: pb_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/project_beta?schema=public"
      NODE_ENV: production
      # Same secret the web container uses; the HTTP server in worker/src/server.ts
      # refuses any request without a matching Authorization: Bearer header.
      WORKER_AUTH_TOKEN: ${WORKER_AUTH_TOKEN}
      # Chromium launched by Playwright stores its profile + cache here.
      # Path matches PLAYWRIGHT_BROWSERS_PATH in the Dockerfile.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Soft kill-switch for headless browser. Set to "1" if you ever
      # need to run the worker without Chromium (saves ~400MB RAM but
      # disables GeBIZ / GeM / GCA / CanadaBuys / AfDB / IFC / IADB /
      # JICA — they'll log "playwright unavailable" and yield zero
      # tenders each run instead of crashing).
      # DISABLE_PLAYWRIGHT: "1"
    # Internal-only HTTP trigger API for the web UI's action buttons.
    # `expose:` makes 8080 reachable from `web` (and other compose services)
    # via http://worker:8080, but NEVER exposes it on the host or public
    # internet.
    expose:
      - "8080"
    # Chromium's IPC sandbox uses /dev/shm. Default is 64MB on Docker,
    # which makes some pages crash. 1GB is generous and Chromium will
    # only allocate what it needs.
    shm_size: "1gb"

  caddy:
    image: caddy:2-alpine
    container_name: pb_caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "tenderfit.detex.site"
      EMAIL: "maazkhaled@gmail.com"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
